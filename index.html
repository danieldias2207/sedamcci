<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SEDAM-CCI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fff;
        }

        #appFrame {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe
        id="appFrame"
        src="https://script.google.com/macros/s/AKfycbwoC6zIfwevX3CvkFIw3bG4c9U71So4YsENE5BIAQmYOtrsLXfs50B2Rvs81Pl4RTr2/exec"
        allow="
            fullscreen;
            clipboard-read;
            clipboard-write;
            geolocation;
            microphone;
            camera;
            payment;
            display-capture;
            autoplay
        "
        allowfullscreen
        loading="eager"
        referrerpolicy="no-referrer-when-downgrade"
        sandbox="
            allow-same-origin
            allow-scripts
            allow-forms
            allow-popups
            allow-popups-to-escape-sandbox
            allow-modals
            allow-downloads
            allow-downloads-without-user-activation
            allow-presentation
            allow-storage-access-by-user-activation
            allow-top-navigation-by-user-activation
        ">
    </iframe>

</body>
</html>
